[package]
name = "openchron"
version = "0.0.0"
edition = "2024"
description = "A cross-platform configuration tool for Keychron keyboards and mice"
license = "MIT"
authors = ["Florian Maunier"]
repository = "https://github.com/fmauNeko/openchron"
readme = "README.md"
publish = false

[dependencies]
gpui-kit = "0.10.0"
futures = "0.3"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native", "linux-native-basic-udev", "macos-shared-device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
